
version: '3.8'

services:
  web:
    image: ${IMAGE_NAME}
    env_file:
      - ./enviroments/.env.prod
    environment:
      - AWS_REGION=${AWS_REGION}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      # Multiple secrets separated by commas (later secrets override earlier ones)
      # Example: "shared/database,shared/api-keys,epico/production"
      - AWS_SECRET_NAMES=${AWS_SECRET_NAMES:-production/api_key/gmaps_smc4}
    secrets:
      - credentials_gmaps_smc4
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2000m
      labels:
        traefik.enable: 'true'
        traefik.http.routers.epico.rule: Host(`epico-movil.apymsa.com.mx`) || Host(`epico.apymsa.com.mx`)
        traefik.http.routers.epico.entrypoints: https
        traefik.http.routers.epico.tls: 'true'
        traefik.http.services.epico.loadbalancer.server.port: 3000
    networks:
      - backend
secrets:
  credentials_gmaps_smc4:
    external: true
networks:
  backend:
    external: true
   

